[Settings]
Enabled=1
DebugLog=1
EnableStageBoxes=1
EnableExtremeBox=1
AutoDetectInstalledUnique=1
ExtremeVisualUnlocked=0
; Icone da Extreme = copia do Stage 3 original, capturado automaticamente no Setup.
; O parametro ExtremeIconKey antigo NAO e mais utilizado.
; Textos: UNIQUES_SHOP_TITLE (chave vanilla), com nomes por categoria via hook do ASI.
; 1 = nome contextual (Engine Unique, ECU Unique etc.) usando chave de traducao nativa
EnableCategoryUniqueName=1
TraceFrontendSelection=1
AllowScrollerTransitionForPreview=1

; Etapa 19: PPPackage nativo. Quatro hooks de seguranca impedem compra/instalacao
; quando a chamada aponta para a estrutura Extreme privada. Se algum hook falhar,
; a caixa Extreme nao sera criada. Validar em copia do jogo e backup do save.
UniqueFNGProbeMode=21
EnableStage16UnsafeNativeRow=0
EnableStage10DrawAudit=0
EnableExtremeStatusPreview=0
EnableExtremeD3DOverlay=0
